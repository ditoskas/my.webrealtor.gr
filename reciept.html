    <title>Απόδειξη Είσπραξης</title>
</head>
<body cz-shortcut-listen="true">
<div class="container mt-4 no-print">
    <form>
        <div class="card" style="overflow: visible;">
            <div class="card-header">
                <h2 class="mb-0">
                    Πληροφορίες
                </h2>
            </div>
            <div class="card-body">
                <div class="form-row">
                    <div class="form-group col-md-3">
                        <label for="txtDate">Ημερομήνια</label>
                        <div class="input-group date date-component" id="txtDate" data-target-input="nearest">
                            <input type="text" class="form-control control-content" data-control-id=".sDate" data-target="#txtDate">
                            <div class="input-group-append" data-target="#txtDate" data-toggle="datetimepicker">
                                <div class="input-group-text"><i class="fa fa-calendar"></i></div>
                            </div>
                        </div>
                    </div>
                    <div class="form-group col-md-2">
                        <label for="txtAmount">Ποσό</label>
                        <input type="text" id="txtAmount" class="control-content form-control" value="" data-control-id=".sAmount">
                    </div>
                    <div class="form-group col-md-7">
                        <label for="txtAmountText">Ποσό σε κείμενο</label>
                        <input type="text" id="txtAmountText" class="control-content form-control" value="" data-control-id=".sAmountText">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group col-md-1">
                        <label for="cmbGender">Προσ.</label>
                        <select id="cmbGender" class="control-content form-control" data-control-id=".sGender">
                            <option value="τον" selected="">Τον</option>
                            <option value="την">Την</option>
                        </select>
                    </div>
                    <div class="form-group col-md-5">
                        <label for="txtFullname">Ονοματεπώνυμο</label>
                        <input type="text" id="txtFullname" class="control-content form-control" value="" data-control-id=".sFullName">
                    </div>
                    <div class="form-group col-md-1">
                        <label for="cmbGenderLavon">Προσ.</label>
                        <select id="cmbGenderLavon" class="control-content form-control" data-control-id=".sGenderLavon">
                            <option value="τον" selected="">Τον</option>
                            <option value="την">Την</option>
                        </select>
                    </div>
                    <div class="form-group col-md-5">
                        <label for="txtFullnameLavon">Ονοματεπώνυμο Λαβών</label>
                        <input type="text" id="txtFullnameLavon" class="control-content form-control" value="" data-control-id=".sFullNameLavon">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group col">
                        <label for="txtReason">Αιτιολογία</label>
                        <textarea id="txtReason" rows="5" class="control-content form-control" data-control-id=".sReason"></textarea>
                    </div>
                </div>
            </div>
        </div>
    </form>
    <div class="jumbotron py-2 px-1 text-center">
        <button class="btn btn-primary" id="btnPrint">Εκτύπωση</button>
    </div>
</div>
